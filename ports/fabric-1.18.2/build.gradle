buildscript {
    repositories { maven { url = 'https://maven.fabricmc.net/' }; gradlePluginPortal() }
    dependencies { classpath 'net.fabricmc:fabric-loom:1.17.17' }
}
apply plugin: 'net.fabricmc.fabric-loom-remap'
apply from: '../production-selectors.gradle'
version = '0.1.3.3'
group = 'dev.creategmf'
base.archivesName = 'create_gmf-0.1.3.3-mc1.18.2-fabric-quilt'
tasks.withType(Jar).configureEach { archiveVersion = '' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8'; options.compilerArgs.addAll(['-Xmaxerrs','200']) }
repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}
def extracted = file('../.legacy-deps/fabric-1.18.2')
if (!new File(extracted, 'mods.json').exists()) throw new GradleException('Run ../prepare-legacy-fabric-deps.ps1 first')
def nested = new groovy.json.JsonSlurper().parse(new File(extracted, 'mods.json'))
dependencies {
    minecraft 'com.mojang:minecraft:1.18.2'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.17.3'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.77.0+1.18.2'
    modImplementation 'maven.modrinth:create-fabric:L283tIV7'
    nested.findAll { !it.id.startsWith('fabric-') && it.id != 'com_github_llamalad7_mixinextras' }.each {
        modImplementation files(new File(extracted, it.file))
    }
    modImplementation 'com.terraformersmc:modmenu:3.2.5'
    modRuntimeOnly 'maven.modrinth:entityculling:d3CbGntl'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.4.1'
    implementation 'io.github.llamalad7:mixinextras-fabric:0.4.1'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.4.1'
    include 'io.github.llamalad7:mixinextras-fabric:0.4.1'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.ow2.asm:asm-tree:9.7.1'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly files(sourceSets.main.compileClasspath)
}
sourceSets.main.java.srcDir('.generated/java')
sourceSets.main.resources.srcDir('.generated/resources')
sourceSets.test.java { srcDir('../../src/test/java'); srcDir('../tests/java'); exclude '**/RecoveryContractTest.java' }
tasks.named('test', Test).configure { useJUnitPlatform() }
loom { mixin { useLegacyMixinAp = true; defaultRefmapName = 'create_gmf.refmap.json' } }
tasks.register('generatePortSources', Exec) {
    commandLine 'pwsh', '-NoProfile', '-File', '../generate-legacy-fabric.ps1', '-Target', 'fabric-1.18.2'
    inputs.dir('../../src/main'); inputs.dir('../legacy/src/main'); inputs.dir('../forge-1.20.1/src/main'); inputs.dir('../fabric-1.20.1/src/main'); inputs.dir('src/main')
    inputs.file('../generate-legacy-fabric.ps1'); inputs.file('../generate-legacy-forge.ps1'); inputs.file('../generate-modern-forge.ps1')
    outputs.dir('.generated')
}
tasks.named('compileJava').configure { dependsOn 'generatePortSources' }
tasks.named('processResources').configure { dependsOn 'generatePortSources' }
jar {
    from('../../LICENSE') { into 'META-INF' }
    from('../../THIRD_PARTY_NOTICES.md') { into 'META-INF' }
    from('../../THIRD_PARTY_LICENSES') { into 'META-INF/third_party' }
}
tasks.named('remapJar').configure { archiveFileName = 'create_gmf-0.1.3.3-mc1.18.2-fabric-quilt.jar' }
