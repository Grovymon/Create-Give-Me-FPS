plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    srcDir(layout.buildDirectory.dir('generated/resources'))
}

def gmfGitCommit = providers.exec {
    commandLine 'git', 'rev-parse', '--short', 'HEAD'
    ignoreExitValue = true
}.standardOutput.asText.map { output ->
    def commit = output.trim()
    commit.isEmpty() ? 'unknown' : commit
}

tasks.register('generateGmfBuildInfo') {
    inputs.property('gitCommit', gmfGitCommit)
    outputs.file(layout.buildDirectory.file('generated/resources/gmf_build.properties'))
    doLast {
        def output = layout.buildDirectory.file('generated/resources/gmf_build.properties').get().asFile
        output.parentFile.mkdirs()
        output.text = "git_commit=${gmfGitCommit.get()}\n"
    }
}

repositories {
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

runs {
    configureEach {
        systemProperty 'forge.logging.console.level', 'info'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }

    client {}

    server {
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"
    // Needed only to compile the optional CreateBetterFPS-derived render path.
    // The mixins are not applied unless both client mods are present at launch.
    compileOnly "maven.modrinth:sodium:mc${minecraft_version}-0.8.12-neoforge"
    compileOnly "maven.modrinth:iris:1.8.14-beta.1+${minecraft_version}-neoforge"
    compileOnly files("${project.projectDir}/libs/sodium-api-0.8.12-neoforge.jar")

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(ProcessResources).configureEach {
    dependsOn('generateGmfBuildInfo')
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            create_version_range   : create_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Version' : mod_version,
                'Implementation-Title'  : project.name,
                'Implementation-Version': archiveVersion
        ])
    }
}

tasks.named('compileJava').configure {
    dependsOn('extractSodiumApi')
}

tasks.register('extractSodiumApi', Copy) {
    from zipTree(configurations.detachedConfiguration(
            dependencies.create("maven.modrinth:sodium:mc${minecraft_version}-0.8.12-neoforge"))
            .singleFile)
    include 'META-INF/jarjar/net.caffeinemc.sodium-neoforge-0.8.12+mc1.21.1-mod.jar'
    eachFile { details ->
        details.path = 'sodium-api-0.8.12-neoforge.jar'
    }
    includeEmptyDirs = false
    into layout.projectDirectory.dir('libs')
}

tasks.named('jar', Jar).configure {
    from('LICENSE') {
        into 'META-INF'
    }
    from('THIRD_PARTY_NOTICES.md') {
        into 'META-INF'
    }
    from('THIRD_PARTY_LICENSES') {
        into 'META-INF/third_party'
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
