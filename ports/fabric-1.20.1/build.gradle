buildscript {
    repositories { maven { url = 'https://maven.fabricmc.net/' }; gradlePluginPortal() }
    dependencies { classpath 'net.fabricmc:fabric-loom:1.17.17' }
}
apply plugin: 'net.fabricmc.fabric-loom-remap'
apply from: '../production-selectors.gradle'
version = '0.1.3.3'
group = 'dev.creategmf'
base.archivesName = 'create_gmf-0.1.3.3-mc1.20.1-fabric-quilt'
tasks.withType(Jar).configureEach { archiveVersion = '' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '200'])
}
repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://mvn.devos.one/releases/' }
    maven { url = 'https://mvn.devos.one/snapshots/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://maven.jamieswhiteshirt.com/libs-release/' }
}
configurations { entityCullingDistribution { transitive = false } }
configurations.configureEach {
    resolutionStrategy.dependencySubstitution {
        substitute module('fuzs.forgeconfigapiport:forgeconfigapiport-fabric') using module('maven.modrinth:forge-config-api-port:1aKtMQZE')
    }
}
dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.17.3'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.6+1.20.1'
    modImplementation 'maven.modrinth:create-fabric:HAqwA6X1'
    modImplementation 'dev.engine-room.flywheel:flywheel-fabric-1.20.1:1.0.5-264'
    modImplementation('net.createmod.ponder:Ponder-Fabric-1.20.1:1.0.91') {
        exclude group: 'fuzs.forgeconfigapiport'
        exclude group: 'dev.engine-room.flywheel'
    }
    modImplementation 'com.tterrag.registrate_fabric:Registrate:1.3.79-MC1.20.1'
    modImplementation 'io.github.fabricators_of_create.Porting-Lib:transfer:2.3.13+1.20.1'
    ['accessors', 'base', 'entity', 'extensions', 'networking', 'obj_loader', 'models',
     'model_generators', 'tags', 'tool_actions', 'client_events', 'brewing'].each { moduleName ->
        modImplementation "io.github.fabricators_of_create.Porting-Lib:${moduleName}:2.3.13+1.20.1"
    }
    modImplementation 'io.github.tropheusj:milk-lib:1.2.60'
    modImplementation 'maven.modrinth:forge-config-api-port:1aKtMQZE'
    modCompileOnly 'com.terraformersmc:modmenu:7.2.2'
    modRuntimeOnly 'com.terraformersmc:modmenu:7.2.2'
    modRuntimeOnly 'maven.modrinth:entityculling:xSrd3qsM'
    entityCullingDistribution 'maven.modrinth:entityculling:xSrd3qsM'
    modCompileOnly 'maven.modrinth:sodium:OihdIimA'
    modCompileOnly 'maven.modrinth:iris:1.7.6+1.20.1-fabric'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.4.1'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'io.github.llamalad7:mixinextras-fabric:0.4.1'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.4.1'
    include 'io.github.llamalad7:mixinextras-fabric:0.4.1'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.ow2.asm:asm-tree:9.7.1'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly files(sourceSets.main.compileClasspath)
}
// Loom's development run does not discover nested jars from the Modrinth
// distribution automatically. Production Entity Culling already embeds these.
dependencies {
    modRuntimeOnly files({ zipTree(configurations.entityCullingDistribution.singleFile)
            .matching { include 'META-INF/jars/*.jar' }.files })
}
sourceSets.main.java.srcDir('.generated/java')
sourceSets.main.resources.srcDir('.generated/resources')
sourceSets.test.java { srcDir('../../src/test/java'); srcDir('../tests/java'); exclude '**/RecoveryContractTest.java' }
tasks.named('test', Test).configure { useJUnitPlatform() }
loom { mixin { useLegacyMixinAp = true; defaultRefmapName = 'create_gmf.refmap.json' } }
tasks.register('generatePortSources', Exec) {
    commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', '../generate-modern-fabric.ps1'
    inputs.dir('../../src/main')
    inputs.dir('../forge-1.20.1/src/main')
    inputs.dir('src/main')
    inputs.file('../generate-modern-forge.ps1')
    inputs.file('../generate-modern-fabric.ps1')
    outputs.dir('.generated')
}
tasks.named('compileJava').configure { dependsOn 'generatePortSources' }
tasks.named('processResources').configure { dependsOn 'generatePortSources' }
jar {
    from('../../LICENSE') { into 'META-INF' }
    from('../../THIRD_PARTY_NOTICES.md') { into 'META-INF' }
    from('../../THIRD_PARTY_LICENSES') { into 'META-INF/third_party' }
}
tasks.named('remapJar').configure {
    archiveFileName = 'create_gmf-0.1.3.3-mc1.20.1-fabric-quilt.jar'
}
