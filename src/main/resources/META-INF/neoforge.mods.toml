modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
displayURL = "https://github.com/Grovymon/Create-Give-Me-FPS"
logoFile = "icon.png"
description = '''${mod_description}'''
displayTest = "MATCH_VERSION"

[[mixins]]
config = "create_gmf.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "create"
type = "required"
versionRange = "${create_version_range}"
ordering = "AFTER"
side = "BOTH"

# GMF's hidden-mechanism optimisation uses Entity Culling's visibility
# transitions.  Keep this client-only so servers do not need the mod.
[[dependencies."${mod_id}"]]
modId = "entityculling"
type = "required"
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"
