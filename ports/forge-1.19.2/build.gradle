plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}
version = '0.1.3.3'
apply from: '../production-selectors.gradle'
group = 'dev.creategmf'
base.archivesName = 'create_gmf-0.1.3.3-mc1.19.2-forge'
tasks.withType(Jar).configureEach { archiveVersion = '' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8'; options.compilerArgs.addAll(['-Xmaxerrs','200']) }
repositories {
    maven { url = '../.maven'; content { includeGroup 'com.jozufozu.flywheel'; includeGroup 'com.tterrag.registrate' } }
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.tterrag.com' }
}
legacyForge {
    enable { forgeVersion = '1.19.2-43.5.2'; disableRecompilation = true }
    mods { create_gmf { sourceSet sourceSets.main } }
    runs {
        client { client(); gameDirectory = file('run/client') }
        server { server(); gameDirectory = file('run/server') }
    }
}
dependencies {
    modImplementation 'maven.modrinth:create:tJVykywJ'
    // Exactly the Flywheel embedded by Create 0.5.1.i; no Flywheel 1.x APIs.
    modImplementation 'com.jozufozu.flywheel:flywheel-forge-1.19.2:0.6.11-22'
    modImplementation 'com.tterrag.registrate:Registrate:MC1.19-1.1.5'
    modRuntimeOnly 'maven.modrinth:entityculling:WR6z6MYC'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.4.1'
    jarJar(implementation('io.github.llamalad7:mixinextras-forge')) {
        version { strictly '[0.4.1,0.5)'; prefer '0.4.1' }
    }
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.4.1'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.ow2.asm:asm-tree:9.7.1'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly files(sourceSets.main.compileClasspath)
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
sourceSets.main.java.srcDir('.generated/java')
sourceSets.main.resources.srcDir('.generated/resources')
sourceSets.test.java { srcDir('../../src/test/java'); exclude '**/RecoveryContractTest.java' }
sourceSets.test.java.srcDir('../tests/java')
tasks.register('generatePortSources', Exec) {
    commandLine 'pwsh', '-NoProfile', '-File', '../generate-legacy-forge.ps1'
    inputs.dir('../../src/main'); inputs.dir('../forge-1.20.1/src/main'); inputs.dir('../legacy/src/main'); inputs.dir('src/main')
    inputs.file('../generate-legacy-forge.ps1'); inputs.file('../generate-modern-forge.ps1')
    outputs.dir('.generated')
}
tasks.named('compileJava').configure { dependsOn 'generatePortSources' }
tasks.named('processResources').configure { dependsOn 'generatePortSources' }
mixin { add sourceSets.main, 'create_gmf.refmap.json'; config 'create_gmf.mixins.json' }
tasks.named('test', Test).configure { useJUnitPlatform() }
jar {
    manifest.attributes('MixinConfigs':'create_gmf.mixins.json', 'Implementation-Version':project.version)
    from('../../LICENSE') { into 'META-INF' }
    from('../../THIRD_PARTY_NOTICES.md') { into 'META-INF' }
    from('../../THIRD_PARTY_LICENSES') { into 'META-INF/third_party' }
    doFirst {
        if (!file('src/main/resources/META-INF/mods.toml').exists())
            throw new GradleException('Legacy port is incomplete. Refusing to package an empty or wrong-version mod.')
    }
}
